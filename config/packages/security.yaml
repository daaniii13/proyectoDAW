security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            custom_authenticators:
                - App\Security\LoginFormAuthenticator
                - App\Security\GoogleAuthenticator

            entry_point: App\Security\LoginFormAuthenticator

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false

            logout:
                path: app_logout
                target: app_inicio

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/registro, roles: PUBLIC_ACCESS }
        - { path: ^/recuperar-contrasena, roles: PUBLIC_ACCESS }
        - { path: ^/restablecer-contrasena, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }